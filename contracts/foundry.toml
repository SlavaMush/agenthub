[profile.default]
src = "src"
out = "out"
libs = ["lib"]
viaIR = true
optimizer = true
optimizer_runs = 200

[profile.ci]
fuzz = {runs = 1000, max_test_rejects = 64000}
invariant = {runs = 100, depth = 50, max_failures = 10}

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"

[etherscan]
base_sepolia = {key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api"}
base_mainnet = {key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api"}

[remappings]
"@openzeppelin/" = "lib/openzeppelin-contracts/"
"forge-std/" = "lib/forge-std/src/"